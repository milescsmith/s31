[tool.poetry]
name = "s31"
version = "0.1.0"
description = "start, shutdown, and monitor AWS compute instances"
authors = ["Miles Smith <mileschristiansmith@gmail.com>"]
license = "LGPL-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
dash = "^2.14.2"
requests = "^2.31.0"
loguru = "^0.7.2"
boto3 = {extras = ["crt"], version = "^1.33.12"}
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
ruff = "^0.1.7"
jupyterlab = "^4.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
