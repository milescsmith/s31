[tool.poetry]
name = "s31"
version = "0.2.1"
description = "start, shutdown, and monitor AWS compute instances"
authors = ["Miles Smith <mileschristiansmith@gmail.com>"]
license = "LGPL-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10,<3.13"
dash = "^2.14.2"
requests = "^2.31.0"
loguru = "^0.7.2"
boto3 = {extras = ["crt"], version = "^1.33.12"}
rich = "^13.7.0"
pysimplegui = {extras = ["all"], version = "^4.60.5"}
boto3-stubs = {extras = ["ec2", "s3"], version = "^1.34.2"}
typer = "^0.9.0"
customtkinter = "^5.2.2"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
ruff = "^0.1.7"
jupyterlab = "^4.0.9"
pyinstaller = "^6.3.0"

[tool.poetry.scripts]
s31 = 's31.cli:app'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
